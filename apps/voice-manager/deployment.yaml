apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-manager
  namespace: voice-manager
  labels:
    app: voice-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-manager
  template:
    metadata:
      labels:
        app: voice-manager
    spec:
      containers:
        - name: voice-manager
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
